name: CouchPotato
options:
  bundleIdPrefix: com.nearbycoder
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 4F2YLTHL8T
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CouchPotato:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: CouchPotato
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    entitlements:
      path: CouchPotato/Resources/CouchPotato.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.nearbycoder.couchpotato]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        aps-environment: development
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.personal-information.calendars: true
    info:
      path: CouchPotato/Resources/Info.plist
      properties:
        CFBundleDisplayName: Couch Potato
        CFBundleName: Couch Potato
        LSApplicationCategoryType: public.app-category.entertainment
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIBackgroundModes: [remote-notification]
        NSCalendarsFullAccessUsageDescription: Couch Potato adds your planned couch nights to your calendar.
        NSCalendarsWriteOnlyAccessUsageDescription: Couch Potato adds your planned couch nights to your calendar.
        TMDBAPIKey: $(TMDB_API_KEY)
        CFBundleURLTypes:
          - CFBundleURLName: com.nearbycoder.couchpotato
            CFBundleURLSchemes: [couchpotato]
        LSApplicationQueriesSchemes: [nflx, hulu, disneyplus, hbomax, videos, aiv, peacock, paramountplus]
        UISupportedInterfaceOrientations~iphone: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nearbycoder.couchpotato
        PRODUCT_NAME: CouchPotato
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  CouchPotatoTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources: [CouchPotatoTests]
    dependencies:
      - target: CouchPotato
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  CouchPotato:
    build:
      targets:
        CouchPotato: all
        CouchPotatoTests: [test]
    test:
      targets: [CouchPotatoTests]
