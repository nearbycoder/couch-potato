<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="1" stop-color="#FFB547"/>
    </linearGradient>
    <radialGradient id="spud" cx="0.38" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#EBC08C"/>
      <stop offset="0.55" stop-color="#C8935A"/>
      <stop offset="1" stop-color="#9E6A37"/>
    </radialGradient>
    <linearGradient id="couch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A9C95"/>
      <stop offset="1" stop-color="#256863"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- sunburst -->
  <g opacity="0.18" fill="#FFFFFF">
    <path d="M512 430 L380 0 H470 Z"/><path d="M512 430 L560 0 H650 Z"/>
    <path d="M512 430 L0 120 V220 Z"/><path d="M512 430 L1024 120 V220 Z"/>
    <path d="M512 430 L760 0 H860 Z"/><path d="M512 430 L170 0 H260 Z"/>
  </g>
  <!-- couch back -->
  <rect x="150" y="470" width="724" height="260" rx="90" fill="url(#couch)" stroke="#6B4226" stroke-width="22"/>
  <!-- spud -->
  <g transform="translate(512 470) rotate(-6)">
    <path d="M0 -270 C150 -275 245 -170 248 -40 C252 110 150 210 20 214 C-130 218 -245 125 -248 -10 C-252 -150 -150 -265 0 -270 Z"
          fill="url(#spud)" stroke="#6B4226" stroke-width="20"/>
    <ellipse cx="-150" cy="-160" rx="16" ry="11" fill="#8C5A2E" opacity="0.55"/>
    <ellipse cx="160" cy="-150" rx="14" ry="10" fill="#8C5A2E" opacity="0.55"/>
    <ellipse cx="170" cy="110" rx="16" ry="11" fill="#8C5A2E" opacity="0.55"/>
    <!-- eyes -->
    <circle cx="-72" cy="-60" r="62" fill="#fff" stroke="#3B2416" stroke-width="10"/>
    <circle cx="78" cy="-60" r="62" fill="#fff" stroke="#3B2416" stroke-width="10"/>
    <circle cx="-60" cy="-48" r="30" fill="#24150C"/>
    <circle cx="90" cy="-48" r="30" fill="#24150C"/>
    <circle cx="-70" cy="-60" r="9" fill="#fff"/>
    <circle cx="80" cy="-60" r="9" fill="#fff"/>
    <!-- cheeks -->
    <circle cx="-130" cy="40" r="34" fill="#E5533D" opacity="0.4"/>
    <circle cx="140" cy="40" r="34" fill="#E5533D" opacity="0.4"/>
    <!-- smile -->
    <path d="M-62 52 Q8 70 78 52 Q8 150 -62 52 Z" fill="#3B2416"/>
  </g>
  <!-- couch seat + arms -->
  <rect x="190" y="660" width="644" height="150" rx="60" fill="url(#couch)" stroke="#6B4226" stroke-width="22"/>
  <rect x="96" y="560" width="170" height="290" rx="80" fill="url(#couch)" stroke="#6B4226" stroke-width="22"/>
  <rect x="758" y="560" width="170" height="290" rx="80" fill="url(#couch)" stroke="#6B4226" stroke-width="22"/>
  <rect x="230" y="850" width="40" height="60" rx="12" fill="#6B4226"/>
  <rect x="754" y="850" width="40" height="60" rx="12" fill="#6B4226"/>
  <!-- popcorn -->
  <g transform="translate(780 640) rotate(12)">
    <path d="M-50 -20 L50 -20 L36 110 L-36 110 Z" fill="#fff" stroke="#6B4226" stroke-width="12"/>
    <path d="M-30 -20 L-24 110 M0 -20 L0 110 M30 -20 L24 110" stroke="#E5533D" stroke-width="14"/>
    <circle cx="-30" cy="-34" r="26" fill="#FFF6E6" stroke="#6B4226" stroke-width="8"/>
    <circle cx="10" cy="-46" r="28" fill="#FFF6E6" stroke="#6B4226" stroke-width="8"/>
    <circle cx="40" cy="-28" r="24" fill="#FFF6E6" stroke="#6B4226" stroke-width="8"/>
  </g>
</svg>
