<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23232D"/>
      <stop offset="1" stop-color="#0B0B0F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.28" r="0.6">
      <stop offset="0" stop-color="#F0A335" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F0A335" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8C25C"/>
      <stop offset="1" stop-color="#E08C1A"/>
    </linearGradient>
    <linearGradient id="goldDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9A334"/>
      <stop offset="1" stop-color="#C77912"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="28"/>
      <feOffset dy="26" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <g filter="url(#shadow)">
    <!-- back cushion -->
    <rect x="236" y="330" width="552" height="250" rx="74" fill="url(#gold)"/>
    <!-- arms -->
    <rect x="128" y="440" width="176" height="300" rx="88" fill="url(#gold)"/>
    <rect x="720" y="440" width="176" height="300" rx="88" fill="url(#gold)"/>
    <!-- seat -->
    <rect x="236" y="560" width="552" height="180" rx="50" fill="url(#goldDeep)"/>
    <!-- legs -->
    <rect x="212" y="730" width="64" height="70" rx="22" fill="#C77912"/>
    <rect x="748" y="730" width="64" height="70" rx="22" fill="#C77912"/>
  </g>
  <!-- seam between cushions -->
  <rect x="236" y="556" width="552" height="8" rx="4" fill="#0B0B0F" opacity="0.35"/>
  <!-- play mark -->
  <path d="M470 600 L470 700 L562 650 Z" fill="#0B0B0F" opacity="0.85"/>
</svg>
