<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Couch Potato</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23232D"/>
      <stop offset="1" stop-color="#0B0B0F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8C25C"/>
      <stop offset="1" stop-color="#E08C1A"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- back cushion -->
  <rect x="13" y="15" width="38" height="20" rx="7" fill="url(#gold)"/>
  <!-- arms -->
  <rect x="5" y="24" width="12" height="26" rx="6" fill="url(#gold)"/>
  <rect x="47" y="24" width="12" height="26" rx="6" fill="url(#gold)"/>
  <!-- seat -->
  <rect x="13" y="34" width="38" height="16" rx="4" fill="#E09A2A"/>
  <!-- legs -->
  <rect x="12" y="50" width="6" height="5" rx="2" fill="#C77912"/>
  <rect x="46" y="50" width="6" height="5" rx="2" fill="#C77912"/>
  <!-- play mark -->
  <path d="M28.5 37 L28.5 47 L37.5 42 Z" fill="#0B0B0F" opacity="0.85"/>
</svg>
